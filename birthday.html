<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday 🎂</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body class="birthday-page">


    <!-- BALLOONS -->

    <div class="balloons">

        <span>🎈</span>
        <span>🎈</span>
        <span>🎈</span>
        <span>🎈</span>
        <span>🎈</span>
        <span>🎈</span>

    </div>


    <main class="birthday-section">


        <p class="eyebrow">
            Page 04 • The big surprise
        </p>


        <h1>

            HAPPY

            <span>
                BIRTHDAY ❤️
            </span>

        </h1>


        <!-- CAKE -->

        <div class="cake">


            <!-- CANDLE -->

            <div class="candle">

                <div class="flame">
                </div>

            </div>


            <!-- CAKE TOP -->

            <div class="cake-top">

                <span>🍓</span>
                <span>🍓</span>
                <span>🍓</span>

            </div>


            <!-- CAKE BODY -->

            <div class="cake-body">

                <div class="cream">
                </div>

                <div class="cream">
                </div>

            </div>


        </div>


        <h2>
            Make A Wish ✨
        </h2>


        <p class="intro">

            Close your eyes...

            <br>

            Think of your biggest wish...

            <br>

            Then press the button ❤️

        </p>


        <button
            onclick="celebrate()"
            class="main-button">

            Make A Wish ✨

        </button>


        <div id="birthday-message">
        </div>


        <a href="final.html"
           class="main-button secondary-button">

            One Last Surprise ❤️

        </a>


    </main>


    <script src="script.js"></script>

</body>

</html>
