<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>A Surprise For You ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="home-page">

    <!-- Background particles -->

    <div class="particles">

        <span>✦</span>
        <span>✧</span>
        <span>⋆</span>
        <span>✦</span>
        <span>✧</span>
        <span>⋆</span>
        <span>✦</span>
        <span>✧</span>

    </div>


    <!-- Floating hearts -->

    <div class="floating-hearts">

        <span>❤️</span>
        <span>💕</span>
        <span>💗</span>
        <span>✨</span>
        <span>❤️</span>
        <span>🌸</span>

    </div>


    <main class="home-content">

        <p class="eyebrow">
            A little surprise made with love
        </p>


        <h1>

            Happy Birthday

            <span>
                My Beautiful Wife ❤️
            </span>

        </h1>


        <!-- Typing text -->

        <p id="typing-text"
           class="typing-text">
        </p>


        <p class="intro">

            I made something special for you...

            <br>

            So take a deep breath
            and open your surprise.

        </p>


        <!-- Countdown -->

        <div class="countdown">

            <div>
                <span id="days">00</span>
                <small>Days</small>
            </div>

            <div>
                <span id="hours">00</span>
                <small>Hours</small>
            </div>

            <div>
                <span id="minutes">00</span>
                <small>Minutes</small>
            </div>

            <div>
                <span id="seconds">00</span>
                <small>Seconds</small>
            </div>

        </div>


        <a href="letter.html"
           class="main-button">

            Open Your Surprise

            <span>→</span>

        </a>


    </main>


    <p class="bottom-text">
        Made especially for you ✦
    </p>


    <script src="script.js"></script>

</body>

</html>
